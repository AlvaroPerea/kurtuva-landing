<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KURTUVA · PPdB47</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #060a10;
    --bg-1: #0b1119;
    --bg-2: #121a26;
    --border: rgba(95, 255, 236, 0.08);
    --border-strong: rgba(95, 255, 236, 0.2);
    --text: #e6edf3;
    --text-muted: #7a8593;
    --text-dim: #4d5663;
    --accent: #5fffec;
    --accent-2: #ff4dff;
    --accent-3: #ffae33;
    --status-up: #3fb950;
    --status-warn: #d29922;
    --status-down: #f85149;
    --glow: 0 0 40px rgba(95, 255, 236, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv01', 'cv11';
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========== AURORA BACKGROUND ========== */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    filter: blur(60px) saturate(140%);
  }

  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    will-change: transform;
    --mx: 0px; --my: 0px;
  }

  .aurora-blob.b1 {
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(40, 220, 130, 0.60), transparent 60%);
    top: -10%; left: -5%;
  }
  .aurora-blob.b2 {
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(80, 255, 160, 0.30), transparent 60%);
    top: 30%; right: -15%;
  }
  .aurora-blob.b3 {
    width: 45vw; height: 45vw;
    background: radial-gradient(circle, rgba(30, 180, 100, 0.40), transparent 60%);
    bottom: -10%; left: 30%;
  }
  .aurora-blob.b4 {
    width: 35vw; height: 35vw;
    background: radial-gradient(circle, rgba(120, 255, 180, 0.20), transparent 60%);
    top: 50%; left: -10%;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(20vw, 30vh) scale(1.2); }
    66%      { transform: translate(40vw, 10vh) scale(0.9); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-30vw, 20vh) scale(1.15); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-20vw, -20vh) scale(1.1); }
    66%      { transform: translate(20vw, -10vh) scale(0.95); }
  }
  @keyframes drift4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40vw, -20vh) scale(1.2); }
  }

  /* Canvas WebGL humo verde */
  #smoke-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Veladura de oscurecimiento sobre el aurora para legibilidad */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(6, 10, 16, 0.4) 60%, rgba(6, 10, 16, 0.85) 100%),
      radial-gradient(circle at 1px 1px, rgba(95, 255, 236, 0.05) 1px, transparent 0);
    background-size: auto, 28px 28px;
  }

  /* Grain noise sutil */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  .container {
    position: relative;
    z-index: 3;
    max-width: 1600px;
    margin: 0 auto;
    padding: 32px 48px 80px;
  }

  /* HEADER */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 32px;
    padding: 40px 0 56px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 56px;
  }

  .logo h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 4.5rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.9;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo .codename {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-top: 8px;
  }

  .logo .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 32px;
    align-items: center;
  }

  .stat { text-align: center; }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.75rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .clock { text-align: right; font-family: 'JetBrains Mono', monospace; }

  .clock .time {
    font-size: 2rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .clock .date {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* SECCIONES */
  section { margin-bottom: 64px; }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
  }

  .section-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .section-header .marker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.2em;
  }

  .section-header .divider {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-strong), transparent);
    margin-left: 16px;
  }

  .section-header .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  /* CARD MÁQUINA */
  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(11, 17, 25, 0.85) 0%, rgba(18, 26, 38, 0.85) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 50%, rgba(95, 255, 236, 0.04));
    pointer-events: none;
    transition: opacity 0.25s;
    opacity: 0;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
    box-shadow: var(--glow);
  }

  .card:hover::before { opacity: 1; }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }

  .card-head .name-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--status-up);
    box-shadow: 0 0 0 0 var(--status-up);
    animation: pulse 2.5s infinite;
    flex-shrink: 0;
  }

  .status-dot.down { background: var(--status-down); animation: pulse-down 2.5s infinite; }
  .status-dot.warn { background: var(--status-warn); animation: pulse-warn 2.5s infinite; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
    70% { box-shadow: 0 0 0 8px rgba(63, 185, 80, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
  }
  @keyframes pulse-down {
    0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); }
    70% { box-shadow: 0 0 0 8px rgba(248, 81, 73, 0); }
    100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
  }
  @keyframes pulse-warn {
    0% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0.7); }
    70% { box-shadow: 0 0 0 8px rgba(210, 153, 34, 0); }
    100% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0); }
  }

  .card .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .card .vmid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    background: rgba(95, 255, 236, 0.08);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .card-tech {
    padding: 14px 20px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    border-bottom: 1px solid var(--border);
  }

  .card-tech .label { color: var(--text-dim); letter-spacing: 0.05em; }
  .card-tech .value { color: var(--text); }
  .card-tech .ip { color: var(--accent); }

  .card-fn {
    padding: 16px 20px 18px;
  }

  .card-fn .purpose {
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 10px;
  }

  .card-fn .features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-fn .features li {
    font-size: 0.78rem;
    color: var(--text-muted);
    padding-left: 16px;
    position: relative;
    line-height: 1.45;
  }

  .card-fn .features li::before {
    content: '▸';
    color: var(--accent);
    position: absolute;
    left: 0;
    top: 0;
    font-size: 0.7rem;
  }

  .card-hint {
    padding: 10px 20px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .card:hover .card-hint { opacity: 1; }

  .idrac-live {
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(95, 255, 236, 0.05);
    border: 1px solid rgba(95, 255, 236, 0.18);
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
  }
  .idrac-live .lbl { color: var(--accent); text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.1em; }
  .idrac-live .val { color: var(--text); }
  .idrac-live.stale { opacity: 0.5; }
  .idrac-live .ts { margin-left: auto; font-size: 0.6rem; opacity: 0.6; }

  .card-hint::before {
    content: '⌖';
    color: var(--accent);
    font-size: 0.85rem;
  }

  /* CARD UI */
  .ui-card {
    position: relative;
    background: linear-gradient(180deg, rgba(11, 17, 25, 0.85) 0%, rgba(18, 26, 38, 0.85) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 180px;
  }

  .ui-card::after {
    content: '';
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--card-color, var(--accent)), transparent 70%);
    opacity: 0.06;
    top: -80px;
    right: -80px;
    transition: all 0.4s;
    pointer-events: none;
  }

  .ui-card:hover {
    transform: translateY(-3px);
    border-color: var(--card-color, var(--accent));
    box-shadow: 0 0 50px var(--card-color-glow, rgba(95, 255, 236, 0.15));
  }

  .ui-card:hover::after {
    opacity: 0.15;
    transform: scale(1.4);
  }

  .ui-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .ui-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--bg-0);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: var(--card-color, var(--accent));
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .ui-arrow {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    transition: all 0.25s;
  }

  .ui-card:hover .ui-arrow {
    color: var(--card-color, var(--accent));
    transform: translate(3px, -3px);
  }

  .ui-card .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }


  .ui-card .card-ip {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--accent);
    opacity: 0.7;
    margin-top: -0.1rem;
    letter-spacing: 0.03em;
  }
  .ui-card .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    word-break: break-all;
  }

  .ui-card .desc {
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--text-muted);
    margin-top: auto;
  }

  /* FOOTER */
  footer {
    margin-top: 80px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* "Próximamente" state */
  .ui-card.soon {
    opacity: 0.55;
    cursor: not-allowed;
    background: linear-gradient(180deg, rgba(11, 17, 25, 0.6) 0%, rgba(18, 26, 38, 0.6) 100%);
  }
  .ui-card.soon:hover { transform: none; border-color: var(--border); box-shadow: none; }
  .ui-card.soon::after { opacity: 0.03 !important; transform: none !important; }
  .ui-card.soon .url { color: var(--text-dim); font-style: italic; }

  .soon-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--accent);
    background: rgba(95, 255, 236, 0.08);
    border: 1px solid rgba(95, 255, 236, 0.18);
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.15em;
  }

  /* UI card colors */
  .ui-card.c-prox { --card-color: #ee7000; --card-color-glow: rgba(238, 112, 0, 0.15); }
  .ui-card.c-idrac { --card-color: #007db8; --card-color-glow: rgba(0, 125, 184, 0.18); }
  .ui-card.c-vault { --card-color: #175ddc; --card-color-glow: rgba(23, 93, 220, 0.15); }
  .ui-card.c-ha { --card-color: #41bdf5; --card-color-glow: rgba(65, 189, 245, 0.15); }
  .ui-card.c-plex { --card-color: #e5a00d; --card-color-glow: rgba(229, 160, 13, 0.15); }
  .ui-card.c-adg { --card-color: #67ba3e; --card-color-glow: rgba(103, 186, 62, 0.15); }
  .ui-card.c-app { --card-color: #ff4dff; --card-color-glow: rgba(255, 77, 255, 0.15); }
  .ui-card.c-code { --card-color: #5fffec; --card-color-glow: rgba(95, 255, 236, 0.15); }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3, 5, 10, 0.65);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: relative;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    background: linear-gradient(180deg, rgba(11, 17, 25, 0.95) 0%, rgba(18, 26, 38, 0.95) 100%);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    overflow: hidden;
    transform: scale(0.92) translateY(20px);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(95, 255, 236, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
  }

  .modal-backdrop.open .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-glow {
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), transparent 30%, transparent 70%, var(--accent-2));
    opacity: 0.4;
    z-index: -1;
    filter: blur(20px);
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 10;
    font-size: 1.2rem;
  }

  .modal-close:hover {
    background: rgba(248, 81, 73, 0.15);
    border-color: rgba(248, 81, 73, 0.4);
    color: var(--status-down);
    transform: rotate(90deg);
  }

  .modal-header {
    padding: 32px 36px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  .modal-header .status-dot {
    margin-top: 14px;
    width: 12px;
    height: 12px;
  }

  .modal-title-block { flex: 1; }

  .modal-vmid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }

  .modal-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .modal-ip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--accent);
    margin-top: 8px;
  }

  .modal-body {
    padding: 24px 36px 32px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body::-webkit-scrollbar { width: 8px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .modal-section { margin-bottom: 28px; }
  .modal-section:last-child { margin-bottom: 0; }

  .modal-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-section-title::before {
    content: '';
    width: 12px;
    height: 1px;
    background: var(--accent);
  }

  .modal-specs {
    display: grid;

  { name: 'Despierta Voice Console', url: '#', short: '◉', cls: 'c-app', desc: 'WebRTC para Despierta: consultar agenda, ver últimos pagos, dictar notas de paciente por voz desde el móvil.', machine: 'planificado · ver pending_voice_consoles.md', soon: true },

// =========================
//  RENDER GRIDS
// =========================
function renderMachines() {
  const grid = document.getElementById('machines-grid');
  grid.innerHTML = machines.map((m, i) => `
    <article class="card" data-idx="${i}" data-probe="${m.probe || ''}">
      <div class="card-head">
        <div class="name-block">
          <span class="status-dot" data-status></span>
          <span class="name">${m.name}</span>
        </div>
        <span class="vmid">${m.vmid}</span>
      </div>
      <div class="card-tech">
        <span class="label">IP</span><span class="value ip">${m.ip}</span>
        <span class="label">CPU</span><span class="value">${m.cores} cores</span>
        <span class="label">RAM</span><span class="value">${m.ram}</span>
        <span class="label">DISK</span><span class="value">${m.storage}</span>
        <span class="label">OS</span><span class="value">${m.os}</span>
      </div>
      <div class="card-fn">
        <div class="purpose">${m.purpose.split('.')[0]}.</div>
        <ul class="features">
          ${m.features.slice(0, 3).map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>
      ${m.id === 'R720' ? `<div class="idrac-live" data-idrac-live><span class="lbl">iDRAC live</span><span class="val" data-k="state">—</span><span class="lbl">power</span><span class="val" data-k="power">—</span><span class="lbl">inlet</span><span class="val" data-k="inlet">—</span><span class="lbl">cpu</span><span class="val" data-k="cpu">—</span><span class="lbl">fans</span><span class="val" data-k="fans">—</span><span class="ts" data-k="ts"></span></div>` : ''}
      <div class="card-hint">click para detalle completo</div>
    </article>
  `).join('');

  document.getElementById('stat-total').textContent = machines.length;
  document.getElementById('machines-count').textContent = `${machines.length} units`;

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(parseInt(card.dataset.idx, 10)));
  });
}

function uiCardHTML(u) {
  const soon = u.soon ? 'soon' : '';
  const canEmbed = !u.soon && !u.noIframe && u.url.includes('kurtuva.com');
  let href, target, onclick;
  if (u.soon) {
    href = '#'; target = ''; onclick = 'onclick="event.preventDefault();return false;"';
  } else if (canEmbed) {
    const esc = u.url.replace(/'/g, "\\'");
    const nameEsc = u.name.replace(/'/g, "\\'");
    href = u.url; target = '';
    onclick = `onclick="event.preventDefault();openIframe('${esc}','${nameEsc}')"`;
  } else {
    href = u.url; target = 'target="_blank" rel="noopener"'; onclick = '';
  }
  return `
    <a class="ui-card ${u.cls || ''} ${soon}" href="${href}" ${target} ${onclick}>
      <div class="ui-card-top">
        <div class="ui-icon">${u.short}</div>
        ${u.soon
          ? '<div class="soon-badge">PRÓXIMAMENTE</div>'
          : `<div class="ui-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg></div>`}
      </div>
      <div class="name">${u.name}</div>
      <div class="url">${u.url}</div>
      ${u.ip ? `<span class="card-ip">${u.ip}</span>` : ''}
      <div class="desc">${u.desc || u.machine}</div>
    </a>
  `;
}

function renderUis() {
  document.getElementById('dev-grid').innerHTML = devUis.map(uiCardHTML).join('');
  document.getElementById('ui-grid').innerHTML = uis.map(uiCardHTML).join('');
  document.getElementById('voice-grid').innerHTML = voiceUis.map(uiCardHTML).join('');

  document.getElementById('stat-uis').textContent = devUis.length + uis.length;
  document.getElementById('dev-count').textContent = `${devUis.length} tools`;
  document.getElementById('ui-count').textContent = `${uis.length} endpoints`;
  document.getElementById('voice-count').textContent = `${voiceUis.length} consoles`;
}

// =========================
//  iDRAC live poller
// =========================
async function refreshIdrac() {
  try {
    const r = await fetch('/idrac.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.querySelectorAll('[data-idrac-live]').forEach(el => {
      const set = (k, v) => { const n = el.querySelector(`[data-k="${k}"]`); if (n) n.textContent = v; };
      set('state', d.state);
      set('power', `${d.power_w}W`);
      set('inlet', `${d.temp.inlet_c}\u00b0C`);
      set('cpu',   `${Math.max(d.temp.cpu1_c, d.temp.cpu2_c)}\u00b0C`);
      set('fans',  `${d.fans.ok}/${d.fans.total}`);
      const dt = new Date(d.ts);
      set('ts', dt.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}));
      const ageMin = (Date.now() - dt.getTime()) / 60000;
      el.classList.toggle('stale', ageMin > 3);
    });
  } catch (e) {
    document.querySelectorAll('[data-idrac-live]').forEach(el => el.classList.add('stale'));
  }
}
setTimeout(refreshIdrac, 500);
setInterval(refreshIdrac, 60000);

// =========================
//  MODAL
// =========================
function openModal(idx) {
  const m = machines[idx];
  document.getElementById('modal-vmid').textContent = m.vmid;
  document.getElementById('modal-name').textContent = m.name;
  document.getElementById('modal-ip').textContent = m.ip;

  // copiar estado del dot original
  const srcDot = document.querySelector(`.card[data-idx="${idx}"] [data-status]`);
  const tgtDot = document.getElementById('modal-dot');
  tgtDot.className = 'status-dot ' + (srcDot.classList.contains('down') ? 'down' : srcDot.classList.contains('warn') ? 'warn' : '');

  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Especificaciones</div>
      <div class="modal-specs">
        <div class="spec-item"><div class="spec-label">CPU</div><div class="spec-value">${m.cores} cores</div></div>
        <div class="spec-item"><div class="spec-label">RAM</div><div class="spec-value">${m.ram}</div></div>
        <div class="spec-item"><div class="spec-label">Storage</div><div class="spec-value">${m.storage}</div></div>
        <div class="spec-item"><div class="spec-label">OS</div><div class="spec-value">${m.os}</div></div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Propósito</div>
      <div class="modal-purpose">${m.purpose}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Funcionalidades</div>
      <ul class="modal-features">
        ${m.features.map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>

    ${m.uis && m.uis.length ? `
      <div class="modal-section">
        <div class="modal-section-title">Interfaces web</div>
        <div class="modal-uis">
          ${m.uis.map(u => {
            const ce = !u.noIframe && u.url.includes('kurtuva.com');
            const esc = u.url.replace(/'/g, "\\'");
            const nameEsc = u.name.replace(/'/g, "\\'");
            const attrs = ce
              ? `href="${u.url}" onclick="event.preventDefault();closeModal();openIframe('${esc}','${nameEsc}')"`
              : `href="${u.url}" target="_blank" rel="noopener"`;
            return `
            <a class="modal-ui-link ui-card ${u.cls || ''}" ${attrs} style="border-radius: 10px; min-height: auto; padding: 12px 16px; flex-direction: row; align-items: center;">
              <div class="ui-icon">${u.short}</div>
              <div class="modal-ui-info">
                <div class="n">${u.name}</div>
                <div class="u">${u.url}</div>
              </div>
              <div class="ui-arrow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
              </div>
            </a>`;
          }).join('')}
        </div>
      </div>
    ` : ''}
  `;

  document.getElementById('modal-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModal(); closeIframe(); }
});

// =========================
//  IFRAME EMBED
// =========================
let _iframeUrl = '';

function openIframe(url, name) {
  _iframeUrl = url;
  document.getElementById('iframe-title').textContent = name;
  document.getElementById('iframe-url-lbl').textContent = url;
  const loading = document.getElementById('iframe-loading');
  loading.classList.remove('gone');
  const el = document.getElementById('iframe-el');
  el.onload = () => loading.classList.add('gone');
  el.src = url;
  document.getElementById('iframe-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeIframe() {
  if (!document.getElementById('iframe-backdrop').classList.contains('open')) return;
  document.getElementById('iframe-backdrop').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { document.getElementById('iframe-el').src = ''; }, 300);
}

document.getElementById('iframe-close-btn').addEventListener('click', closeIframe);
document.getElementById('iframe-tab-btn').addEventListener('click', () => window.open(_iframeUrl, '_blank'));

// =========================
//  STATUS PROBES
// =========================
async function probeAll() {
  const cards = document.querySelectorAll('.card[data-probe]');
  let online = 0;

  for (const card of cards) {
    const probe = card.dataset.probe;
    const dot = card.querySelector('[data-status]');
    if (!probe) {
      dot.classList.add('warn');
      continue;
    }
    const [type, ...rest] = probe.split(':');
    const url = rest.join(':');
    try {
      await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(3000) });
      dot.classList.remove('down', 'warn');
      online++;
    } catch (e) {
      dot.classList.add('down');
    }
  }
  document.getElementById('stat-online').textContent = online;
}

  document.getElementById('clock-time').textContent = now.toTimeString().slice(0, 8);

}

// ── WebGL fluid smoke shader ────────────────────────────────────────────────
// Simula humo verde turbulento reactivo al ratón usando GLSL en GPU.
// Sin dependencias externas — WebGL nativo.
(function() {
    var canvas = document.getElementById('smoke-canvas');
    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return; // fallback: sin efecto, fondo negro del body

    // ── Vertex shader: quad a pantalla completa ──────────────────────────────
    var VS = [
        'attribute vec2 a_pos;',
        'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
    ].join('\n');

    // ── Fragment shader: ruido simplex + advección del cursor ────────────────
    // Paleta: negros profundos → verdes esmeralda → verde-cyan tenue
    var FS = [
        'precision mediump float;',
        'uniform float u_time;',
        'uniform vec2  u_res;',
        'uniform vec2  u_mouse;',
        'uniform vec2  u_vel;',

        'vec2 hash2(vec2 p) {',
        '  p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));',
        '  return -1.0 + 2.0*fract(sin(p)*43758.5453);',
        '}',

        'float gnoise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  vec2 u = f*f*(3.0-2.0*f);',
        '  return mix(',
        '    mix(dot(hash2(i),           f),           dot(hash2(i+vec2(1,0)), f-vec2(1,0)), u.x),',
        '    mix(dot(hash2(i+vec2(0,1)), f-vec2(0,1)), dot(hash2(i+vec2(1,1)), f-vec2(1,1)), u.x), u.y);',
        '}',

        'float fbm(vec2 p) {',
        '  float v=0.0, a=0.55;',
        '  mat2 R = mat2(1.7,1.3,-1.3,1.7);',
        '  for(int i=0;i<5;i++){ v+=a*gnoise(p); p=R*p; a*=0.48; }',
        '  return v;',
        '}',

        'void main() {',
        '  vec2 uv = gl_FragCoord.xy / u_res;',
        '  uv.y = 1.0 - uv.y;',

        '  vec2 p = uv * 3.2;',
        '  p.y -= u_time * 0.10;',
        '  p.x += sin(u_time*0.12)*0.08;',

        '  float md = length(uv - u_mouse);',
        '  p += u_vel * exp(-md*md*10.0) * 5.0;',

        '  vec2 q = vec2(fbm(p), fbm(p+vec2(5.2,1.3)));',
        '  vec2 r = vec2(fbm(p+2.0*q+vec2(1.7,9.2)), fbm(p+2.0*q+vec2(8.3,2.8)));',
        '  float f = fbm(p + 2.5*r);',

        '  f = f*0.5 + 0.5;',
        '  f = smoothstep(0.1, 0.95, f);',

        '  float e = 0.0;',
        '  e += smoothstep(0.55, 0.0, length(uv - vec2(0.25, 1.1)))*0.8;',
        '  e += smoothstep(0.50, 0.0, length(uv - vec2(0.72, 1.05)))*0.7;',
        '  e += smoothstep(0.40, 0.0, length(uv - vec2(0.50, 1.02)))*0.5;',
        '  e = clamp(e, 0.0, 1.0);',

        '  float smoke = clamp(f*0.75 + e*0.55, 0.0, 1.0);',

        '  smoke *= smoothstep(0.0,0.06,uv.x) * smoothstep(0.0,0.06,1.0-uv.x);',
        '  smoke *= 1.0 - smoothstep(0.05, 0.80, 1.0-uv.y)*0.6;',

        '  vec3 col = vec3(0.024, 0.039, 0.063);',

        '  col = mix(col, vec3(0.01,0.08,0.04),  smoothstep(0.00,0.20,smoke));',
        '  col = mix(col, vec3(0.03,0.20,0.09),  smoothstep(0.15,0.35,smoke));',
        '  col = mix(col, vec3(0.05,0.42,0.18),  smoothstep(0.28,0.52,smoke));',
        '  col = mix(col, vec3(0.10,0.68,0.30),  smoothstep(0.44,0.68,smoke));',
        '  col = mix(col, vec3(0.20,0.88,0.44),  smoothstep(0.62,0.82,smoke));',
        '  col = mix(col, vec3(0.42,1.00,0.68),  smoothstep(0.78,0.94,smoke));',

        '  gl_FragColor = vec4(col, 1.0);',
        '}'
    ].join('\n');

    // ── Compilar shaders ─────────────────────────────────────────────────────
    function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER,   VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    // ── Quad que cubre la pantalla completa ──────────────────────────────────
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    // ── Uniforms ─────────────────────────────────────────────────────────────
    var uTime  = gl.getUniformLocation(prog, 'u_time');
    var uRes   = gl.getUniformLocation(prog, 'u_res');
    var uMouse = gl.getUniformLocation(prog, 'u_mouse');
    var uVel   = gl.getUniformLocation(prog, 'u_vel');

    // ── Seguimiento del ratón con velocidad ──────────────────────────────────
    var mx = 0.5, my = 0.5;   // posición normalizada
    var vx = 0.0, vy = 0.0;   // velocidad
    var pmx = 0.5, pmy = 0.5; // posición anterior

    document.addEventListener('mousemove', function(e) {
        pmx = mx; pmy = my;
        mx = e.clientX / window.innerWidth;
        my = 1.0 - e.clientY / window.innerHeight;
        vx = (mx - pmx) * 0.4;
        vy = (my - pmy) * 0.4;
    });

    // ── Resize ───────────────────────────────────────────────────────────────
    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Loop de renderizado ──────────────────────────────────────────────────
    var t0 = performance.now();
    function frame() {
        var t = (performance.now() - t0) * 0.001;
        // La velocidad se amortigua entre frames para un efecto más suave
        vx *= 0.88; vy *= 0.88;

        gl.uniform1f(uTime,  t);
        gl.uniform2f(uRes,   canvas.width, canvas.height);
        gl.uniform2f(uMouse, mx, my);
        gl.uniform2f(uVel,   vx, vy);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
